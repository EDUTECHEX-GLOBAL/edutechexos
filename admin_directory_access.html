<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directory & Access • Admin Console</title>
  <meta name="description" content="Manage users, groups, permissions and access control for the system." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="design_system.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    .toolbar { margin: var(--space-md) 0; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; }
    .modal.active { display:flex; }
    .modal-content { background:var(--color-surface); padding:var(--space-lg); border-radius:8px; width:90%; max-width:400px; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo"><strong>Admin Console</strong></div>
    <nav>
      <a href="admin_overview.html">Overview</a>
      <a href="admin_directory_access.html">Directory &amp; Access</a>
      <a href="admin_operations_comms.html">Ops &amp; Comms</a>
      <a href="admin_time_attendance.html">Time &amp; Attendance</a>
      <a href="admin_productivity_analytics.html">Productivity</a>
    </nav>
  </header>

  <main class="container fade-in-up">
    <h1 class="fade-in-up" style="font-size: var(--font-size-xl);">Directory &amp; Access</h1>
    <div class="toolbar">
      <button class="btn" id="addUserBtn">Add User</button>
      <button class="btn" id="addGroupBtn">Add Group</button>
    </div>
    <table class="table">
      <thead>
        <tr>
          <th>User</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Alice</td>
          <td>alice@example.com</td>
          <td>Admin</td>
          <td><span style="color:var(--color-primary);">Active</span></td>
          <td><button class="btn" style="font-size:0.8rem;">Edit</button> <button class="btn" style="font-size:0.8rem; background:var(--color-accent);">Delete</button></td>
        </tr>
        <tr>
          <td>Bob</td>
          <td>bob@example.com</td>
          <td>Editor</td>
          <td><span style="color:var(--color-muted);">Inactive</span></td>
          <td><button class="btn" style="font-size:0.8rem;">Edit</button> <button class="btn" style="font-size:0.8rem; background:var(--color-accent);">Delete</button></td>
        </tr>
        <!-- Additional rows -->
      </tbody>
    </table>
  </main>

  <!-- Simple modal placeholder for Add/Edit forms -->
  <div class="modal" id="userModal">
    <div class="modal-content">
      <h2>Add / Edit User</h2>
      <p>Form fields would go here.</p>
      <button class="btn" onclick="document.getElementById('userModal').classList.remove('active')">Close</button>
    </div>
  </div>

  <footer class="container" style="margin-top: var(--space-xl); text-align:center; font-size:0.9rem; color:var(--color-muted);">
    © 2026 Admin Console – All rights reserved.
  </footer>

  <script>
    document.getElementById('addUserBtn').addEventListener('click',()=>{
      document.getElementById('userModal').classList.add('active');
    });
  </script>
</body>
</html>
