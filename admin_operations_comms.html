<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operations & Communications • Admin Console</title>
  <meta name="description" content="View recent operations, system logs and communication feeds for administrators." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="design_system.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    .feed { max-height: 500px; overflow-y:auto; background:var(--color-surface); padding:var(--space-md); border-radius:8px; }
    .log-item { margin-bottom:var(--space-sm); }
    .log-item span { color:var(--color-muted); font-size:0.9rem; }
    .chip { display:inline-block; padding:2px 8px; border-radius:12px; font-size:0.8rem; margin-right:4px; }
    .chip.info { background:var(--color-primary); color:#000; }
    .chip.warn { background:#ffb74d; color:#000; }
    .chip.error { background:#e57373; color:#000; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo"><strong>Admin Console</strong></div>
    <nav>
      <a href="admin_overview.html">Overview</a>
      <a href="admin_directory_access.html">Directory &amp; Access</a>
      <a href="admin_operations_comms.html">Ops &amp; Comms</a>
      <a href="admin_time_attendance.html">Time &amp; Attendance</a>
      <a href="admin_productivity_analytics.html">Productivity</a>
    </nav>
  </header>

  <main class="container fade-in-up">
    <h1 class="fade-in-up" style="font-size: var(--font-size-xl);">Operations &amp; Communications</h1>
    <div class="toolbar">
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
    <div class="feed" id="logFeed">
      <div class="log-item">
        <span class="chip info">INFO</span>
        <strong>Backup completed</strong> – 09:12 AM
      </div>
      <div class="log-item">
        <span class="chip warn">WARN</span>
        <strong>High CPU usage</strong> on server‑01 – 08:45 AM
      </div>
      <div class="log-item">
        <span class="chip error">ERROR</span>
        <strong>Failed login attempt</strong> – user <em>bob</em> – 08:30 AM
      </div>
      <!-- Additional log items would be injected dynamically -->
    </div>
  </main>

  <footer class="container" style="margin-top: var(--space-xl); text-align:center; font-size:0.9rem; color:var(--color-muted);">
    © 2026 Admin Console – All rights reserved.
  </footer>

  <script>
    document.getElementById('refreshBtn').addEventListener('click',()=>{
      // Placeholder for refresh logic – in a real app you would fetch new logs via API.
      alert('Refresh triggered – logs would be reloaded.');
    });
  </script>
</body>
</html>
